<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component gallery — Final Variant (warm-minimal)</title>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  body { font-family: var(--font, system-ui); background: var(--bg); color: var(--text); padding: 32px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .comp { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius, 10px);
    padding: 18px; transition: border-color .15s var(--ease, ease), transform .15s var(--ease, ease); }
  .comp:hover { border-color: var(--accent); transform: translateY(-1px); }
  .comp-name { font-weight: 600; }
  .comp-file { font-size: 12px; color: var(--text-muted); font-family: var(--mono, monospace); }
</style></head><body>

</body></html>
