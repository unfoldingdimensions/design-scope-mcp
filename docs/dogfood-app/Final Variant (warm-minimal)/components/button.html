<!DOCTYPE html>
<!-- design-scope final variant component: Button -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button — component</title>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  body { font-family: var(--font, system-ui); background: var(--bg); color: var(--text);
         padding: 32px; margin: 0; }
  .demo-grid { display: grid; gap: 24px; max-width: 720px; }
  .demo-section h2 { font-size: 15px; font-weight: 600; color: var(--text-muted); margin: 0 0 12px; }
  .demo-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .demo-block { background: var(--surface); border: 1px solid var(--border);
                 border-radius: var(--radius, 8px); padding: 20px; }
  .note { font-size: 12px; color: var(--text-muted); font-family: var(--mono, monospace); }
  
  .btn { background: var(--accent); color: var(--accent-ink, #fff); border: none;
         border-radius: var(--radius-control, 6px); padding: 10px 18px; font-family: var(--font);
         font-size: 14px; font-weight: 600; cursor: pointer;
         transition: transform .15s var(--ease, ease), box-shadow .15s var(--ease, ease), opacity .15s var(--ease, ease); }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.loading { opacity: .7; cursor: progress; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--text-muted); background: var(--surface); }
  .btn-danger { background: var(--danger, #dc2626); }

</style>
</head>
<body>
<div class="demo-grid">
  <div class="note">Component: Button · tokens: assets/tokens.css · self-contained</div>
  <div class="demo-section"><h2>Button — all states</h2>
  <div class="demo-row">
    <button class="btn">Primary</button>
    <button class="btn" disabled>Disabled</button>
    <button class="btn loading">Loading…</button>
  </div>
  <div class="demo-row" style="margin-top:12px">
    <button class="btn btn-ghost">Ghost</button>
    <button class="btn btn-danger">Danger</button>
  </div>
  <div class="note">States: default · hover · active · focus-visible · disabled · loading. Focus with Tab.</div>
</div>
<script>document.querySelector('.btn.loading').addEventListener('click', e => { e.target.textContent = 'Saving…'; setTimeout(() => e.target.textContent = 'Saved ✓', 1200); });</script>

</div>
<script src="../assets/theme.js"></script>
</body>
</html>
