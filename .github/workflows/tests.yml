name: tests

on: [push, pull_request]

jobs:
  unit:
    # windows-latest is not redundant: its console codepage is what broke three
    # suites with UnicodeEncodeError while the ubuntu-only matrix stayed green.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Style search unit tests
        run: python tests/test_style_search.py
      - name: Semantic classifier tests
        run: python tests/test_semantic_pass.py
      - name: Style index tests
        run: python tests/test_style_index.py
      - name: Behavior-pass diff tests
        run: python tests/test_behavior_pass.py
      - name: Cross-module vocabulary consistency
        run: python tests/test_vocabulary_consistency.py
      - name: Capture queue mock (no network, no browser)
        run: python tests/client_smoke.py --queue
